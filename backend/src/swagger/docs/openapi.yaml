  /storage/{path}:
    delete:
      tags: [Storage]
      summary: Delete a file
      description: |
        Delete a file from storage by its path (ADMIN only).
        
        The path should be the relative path returned from upload (e.g., `products/3f21d88d_1754300000.webp`).
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
