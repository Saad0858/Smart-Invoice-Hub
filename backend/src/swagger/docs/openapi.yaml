  # ============================================
  # ANALYTICS PARAMETERS
  # ============================================

  PeriodParam:
    name: period
    in: query
    description: Time period for report
    required: false
    schema:
      type: string
      enum: [daily, weekly, monthly, yearly, custom]
      default: monthly

  StartDateParam:
    name: startDate
    in: query
    description: Start date for custom period (YYYY-MM-DD)
    required: false
    schema:
      type: string
      format: date

  EndDateParam:
    name: endDate
    in: query
    description: End date for custom period (YYYY-MM-DD)
    required: false
    schema:
      type: string
      format: date

  IntervalParam:
    name: interval
    in: query
    description: Grouping interval
    required: false
    schema:
      type: string
      enum: [daily, weekly, monthly]
      default: monthly

  DaysThresholdParam:
    name: daysThreshold
    in: query
    description: Days threshold for slow moving products
    required: false
    schema:
      type: integer
      minimum: 1
      default: 90

  MonthsParam:
    name: months
    in: query
    description: Number of months for comparison
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 60
      default: 12

  SearchQueryParam:
    name: q
    in: query
    description: Search query (minimum 2 characters)
    required: true
    schema:
      type: string
      minLength: 2

  SearchLimitParam:
    name: limit
    in: query
    description: Maximum results per category
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 10

  # ============================================
  # ANALYTICS PATHS
  # ============================================

  # Invoice History
  /analytics/invoices/history:
    get:
      tags: [Reports]
      summary: List invoices with comprehensive filtering
      description: Returns paginated list of invoices with filters for invoice number, customer, date range, status, payment status, and created by
      operationId: getInvoiceHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: customerId
          in: query
          description: Filter by customer ID
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by invoice status
          required: false
          schema:
            type: string
            enum: [DRAFT, GENERATED, CANCELLED]
        - name: paymentStatus
          in: query
          description: Filter by payment status
          required: false
          schema:
            type: string
            enum: [PENDING, PARTIAL, PAID]
        - name: createdBy
          in: query
          description: Filter by creator user ID
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
      responses:
        '200':
          description: Invoice history retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvoiceHistoryPaginatedResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analytics/invoices/history/{id}:
    get:
      tags: [Reports]
      summary: Get invoice by ID with full details
      description: Returns a single invoice with all items and customer details
      operationId: getInvoiceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvoiceHistoryItem'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analytics/invoices/search:
    get:
      tags: [Reports]
      summary: Quick search for invoices
      description: Returns invoices matching the search query (invoice number, customer name, or customer code)
      operationId: searchInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQueryParam'
        - $ref: '#/components/parameters/SearchLimitParam'
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceHistoryItem'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analytics/invoices/export:
    get:
      tags: [Reports]
      summary: Export invoices to CSV
      description: Returns invoice data formatted for CSV export with all fields
      operationId: exportInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - name: customerId
          in: query
          description: Filter by customer ID
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by invoice status
          required: false
          schema:
            type: string
            enum: [DRAFT, GENERATED, CANCELLED]
        - name: paymentStatus
          in: query
          description: Filter by payment status
          required: false
          schema:
            type: string
            enum: [PENDING, PARTIAL, PAID]
        - name: createdBy
          in: query
          description: Filter by creator user ID
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
      responses:
        '200':
          description: Export data retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
