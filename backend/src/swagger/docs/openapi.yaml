        **Supported formats:** JPEG, PNG, WebP, SVG
        **Maximum file size:** 5 MB
        **Folder:** signatures (fixed)
        
        The file will be renamed to `<uuid>_<timestamp>.<extension>` format
        and stored in the signatures folder.
      operationId: uploadSignature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
