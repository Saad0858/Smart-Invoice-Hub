  # Activity Logs
  /activity-logs:
    get:
      tags: [Activity Logs]
      summary: List activity logs
      description: Returns paginated audit trail
      operationId: listActivityLogs
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: userId
          in: query
          description: Filter by user
          required: false
          schema:
            type: string
        - name: module
          in: query
          description: Filter by module
          required: false
          schema:
            type: string
            enum: [AUTH, PRODUCTS, CUSTOMERS, INVOICES, SETTINGS, REPORTS, USERS]
        - name: action
          in: query
          description: Filter by action
          required: false
          schema:
            type: string
            enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT, PRINT, CANCEL, GENERATE_PDF]
        - name: entity
          in: query
          description: Filter by entity type
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter by date range start
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter by date range end
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of activity logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogPaginatedResponse'

