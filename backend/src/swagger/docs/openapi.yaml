      summary: Get storage configuration
      description: Returns storage configuration including provider, bucket, and upload limits.
      operationId: getStorageConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Storage configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StorageConfig'

  # Storage schemas
  UploadedFile:
    type: object
    properties:
      fileName:
        type: string
        example: "3f21d88d_1754300000.webp"
      originalName:
        type: string
        example: "company-logo.png"
      folder:
        type: string
        enum: [company, products, signatures]
        example: "products"
      path:
        type: string
        example: "products/3f21d88d_1754300000.webp"
      url:
        type: string
        format: uri
        example: "https://example.com/storage/products/3f21d88d_1754300000.webp"
      mimeType:
        type: string
        example: "image/webp"
      size:
        type: integer
        example: 154321
      provider:
        type: string
        enum: [local, supabase]
        example: "supabase"

  StorageConfig:
    type: object
    properties:
      provider:
        type: string
        enum: [local, supabase]
        example: "supabase"
      bucket:
        type: string
        example: "smart-invoice-hub"
      baseUrl:
        type: string
        format: uri
        example: "https://api.example.com"
      folders:
        type: array
        items:
          type: string
          enum: [company, products, signatures]
        example: ["company", "products", "signatures"]
      limits:
        type: object
        properties:
          fileSize:
            type: integer
            example: 5242880
          allowedMimeTypes:
            type: array
            items:
              type: string
            example: ["image/jpeg", "image/png", "image/webp", "image/svg+xml"]
          allowedExtensions:
            type: array
            items:
              type: string
            example: [".jpg", ".jpeg", ".png", ".webp", ".svg"]

