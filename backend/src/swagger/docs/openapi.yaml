    get:
      tags: [Storage]
      summary: Get public URL for a file
      description: |
        Get the public URL for a file in storage.
        
        The path should be the relative path returned from upload (e.g., `products/3f21d88d_1754300000.webp`).
      operationId: getFileUrl
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
