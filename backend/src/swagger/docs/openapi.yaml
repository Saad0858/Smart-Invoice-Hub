  # Storage
  /storage/upload/image:
    post:
      tags: [Storage]
      summary: Upload an image file
      description: |
        Upload an image file to storage (ADMIN only).
        
        **Supported formats:** JPEG, PNG, WebP, SVG
        **Maximum file size:** 5 MB
        **Allowed folders:** company, products, signatures
        
        The file will be renamed to `<uuid>_<timestamp>.<extension>` format
        and stored in the specified folder.
      operationId: uploadImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to upload
      parameters:
        - name: folder
          in: query
          description: Target folder for the upload
          required: false
          schema:
            type: string
            enum: [company, products, signatures]
            default: products
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadedFile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/upload/signature:
    post:
      tags: [Storage]
      summary: Upload a signature file
      description: |
