  # Invoices
  /invoices:
    get:
      tags: [Invoices]
      summary: List all invoices
      description: Returns paginated list of invoices with filters
      operationId: listInvoices
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: customerId
          in: query
          description: Filter by customer
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [DRAFT, GENERATED, CANCELLED]
        - name: startDate
          in: query
          description: Filter by invoice date range start
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter by invoice date range end
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePaginatedResponse'
    post:
      tags: [Invoices]
      summary: Create a new invoice
      description: Creates a new invoice with items (calculates GST automatically)
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice by ID
      description: Returns invoice with all items and customer details
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Invoices]
      summary: Update invoice
      description: Updates invoice (only DRAFT invoices can be updated)
      operationId: updateInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot update non-DRAFT invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Invoices]
      summary: Cancel invoice
      description: Cancels an invoice (sets status to CANCELLED)
      operationId: cancelInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Download invoice PDF
      description: Generates and returns PDF for the invoice
      operationId: downloadInvoicePdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Invoice not found

  # Company Settings
  /company:
    get:
      tags: [Settings]
      summary: Get company settings
      description: Returns company settings (ADMIN, ACCOUNTANT)
      operationId: getCompanySettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Company settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanySettings'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
