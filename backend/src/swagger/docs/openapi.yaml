              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url:
                            type: string
                            format: uri
                            example: "https://example.com/storage/products/3f21d88d_1754300000.webp"
        '400':
          description: Path parameter is required
          content:
            application/json:
              schema:
